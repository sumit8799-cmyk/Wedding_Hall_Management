{% load static %}
{% include 'hall/header.html' %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6 d-flex justify-content-between align-items-center">
              <h1 class="m-0">Profile</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="{% url 'dashbord' %}">Home</a></li>
              <li class="breadcrumb-item active">Profile</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <!-- left column -->
          <div class="col-md-6">
            <!-- general form elements -->
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Profile</h3>
              </div>
              <!-- /.card-header -->
              <!-- form start -->
              <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="card-body">
                  <div class="form-group">
                    <label for="hallName">Hall Name</label>
                    <input type="text" class="form-control" id="hallName" placeholder="Enter Hall Name" name="hallName" value="{{ admin.hallName }}" oninput="this.value = this.value.replace(/[^A-Za-z. ']/g, '').replace(/^\s+/, '')" required>
                  </div>
                  <div class="form-group">
                    <label for="adminName">Admin Name</label>
                    <input type="text" class="form-control" id="adminName" placeholder="Enter Admin Name" name="adminName" value="{{ admin.adminName }}" oninput="this.value = this.value.replace(/[^A-Za-z ']/g, '').replace(/^\s+/, '')" required>
                  </div>

                  <div class="form-group">
                    <label for="exampleInputEmail1">Mobile Number</label>
                    <input type="text" class="form-control" placeholder="Enter Mobile Number" value="{{ admin.mobileNumber }}" minlength="10" maxlength="10" name="mobileNumber" pattern="[0-9]{10}" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                  </div>

                  <div class="form-group">
                    <label for="emailAddress">Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter Email Address" name="emailAddress" value="{{ admin.emailAddress }}" required>
                  </div>
                  <div class="form-group">
                    <label for="image">Image</label>
                    {% if admin.image %}
                  <div class="mb-2">
                      <img src="{{ admin.image.url }}" alt="Admin profile image" style="width: 90px; height: 90px; object-fit: cover;" class="img-circle">
                  </div>
                    {% endif %}
                    <input type="file" class="form-control" id="image" name="image" accept=".jpg,.jpeg,.png,.webp">
                  </div>
                </div>
                <!-- /.card-body -->
                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            </div>
            <!-- /.card -->
          </div>
          <!--/.col (left) -->
          <!-- right column -->
          <div class="col-md-6">
            
          </div>
          <!--/.col (right) -->
        </div>
        <!-- /.row -->
      </div><!-- /.container-fluid -->
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
 {% include 'hall/footer.html' %}
