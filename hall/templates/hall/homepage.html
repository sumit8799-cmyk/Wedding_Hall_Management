{% include 'hall/header.html' %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6 d-flex justify-content-between align-items-center">
              <h1 class="m-0">Home</h1>
              <a href="{% url 'homepagelist' %}">
                <button class="btn btn-primary">List</button>
              </a>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="{% url 'dashbord' %}">Home</a></li>
              <li class="breadcrumb-item active">Home</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <!-- left column -->
          <div class="col-md-6">
            <!-- general form elements -->
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Add Info</h3>
              </div>
              <!-- /.card-header -->
              <!-- form start -->
              <form method="post" enctype="multipart/form-data" onsubmit="return validate()">

                {% csrf_token %}
        <!-- Logo -->
        <div class="form-group">
            <label>Logo</label>
            <div class="input-group">
                <div class="custom-file">
                  <input type="file" class="custom-file-input" id="logo" name="logo" accept="image/*">
                  <label class="custom-file-label" for="logo">Choose logo</label></div>
            </div>
        </div>

        <!-- Background Image -->
        <div class="form-group">
            <label>Image</label>
            <div class="input-group">
                <div class="custom-file">
                    <input type="file" class="custom-file-input" id="img" name="image" accept="image/*">
                    <label class="custom-file-label" for="img">Choose background image</label>
                </div>
            </div>
        </div>

        <!-- First Heading -->
        <div class="form-group"> 
            <label>Heading</label>
            <input type="text"class="form-control"id="head"name="heading"placeholder="Enter Heading" onkeypress="return /[A-Za-z ]/.test(event.key)">
        </div>

        <!-- First Paragraph -->
        <div class="form-group">
            <label>Paragraph</label>
            <textarea class="form-control" rows="3" placeholder="Enter Paragraph" id="par" name="description"></textarea>
        </div>

        <!-- Second Heading -->
        <div class="form-group">
            <label>Second Heading</label>
            <input type="text" class="form-control" id="he" name="secondHeading" placeholder="Enter Heading" onkeypress="return /[A-Za-z ]/.test(event.key)">
        </div>

        <!-- Second Paragraph -->
        <div class="form-group">
            <label>Second Paragraph</label>
            <textarea class="form-control" rows="3" placeholder="Enter Paragraph" id="pa" name="secondDescription"></textarea>
        </div>

        <!-- Third Heading -->
        <div class="form-group">
            <label>Third Heading</label>
            <input type="text" class="form-control" id="heading" name="thirdHeading" placeholder="Enter Heading" onkeypress="return /[A-Za-z ]/.test(event.key)">
        </div>

        <!-- Third Paragraph -->
        <div class="form-group">
            <label>Third Paragraph</label>
            <textarea class="form-control" rows="3" placeholder="Enter Paragraph" id="Paragra" name="thirdDescription"></textarea>
        </div>
        <div class="card-footer">
            <button type="submit"class="btn btn-primary">Submit</button>
        </div>
      </div>
                <!-- /.card-body -->
                  <!-- Footer -->
                  

                </form>
            </div>


            <!-- Java  Script Add Function Call -->
              <script>
                  document.querySelectorAll('.custom-file-input').forEach(function (input) {
                    input.addEventListener('change', function () {
                      var label = this.nextElementSibling;
                      label.textContent = this.files.length
                        ? this.files[0].name
                        : (this.id === 'logo' ? 'Choose logo' : 'Choose background image');
                    });
                  });

                  function validate()
                  {
                    var logo = document.getElementById('logo').value;
                      if(logo == '')
                      {
                        alert("Plase Enter logo")
                        return false
                      }

                    var img = document.getElementById('img').value;
                      if(img == '')
                      {
                        alert("Plase Enter Your Image")
                        return false
                      }
                      
                    var head = document.getElementById('head').value;
                      if(head == '')
                      {
                        alert("Plase Enter Headding")
                        return false
                      }

                       var par = document.getElementById('par').value;
                      if(par == '')
                      {
                        alert("Plase Enter Paragraph")
                        return false
                      }


                      // Second SECOND PARAGRAPH PROSSECE IN PROJECT USE

                       var he = document.getElementById('he').value;
                      if(he == '')
                      {
                        alert("Plase Enter Second Headding")
                        return false
                      }

                       var pa = document.getElementById('pa').value;
                      if(pa == '')
                      {
                        alert("Plase Enter Second Paragraph")
                        return false
                      }

                      // <!-- THIRD PARAGRAPH PROSSECE IN PROJECT USE  -->

                        var heading = document.getElementById('heading').value;
                      if(heading == '')
                      {
                        alert("Plase Enter Third Headding")
                        return false
                      }

                       var Paragra = document.getElementById('Paragra').value;
                      if(Paragra == '')
                      {
                        alert("Plase Enter Third Paragraph")
                        return false
                      }
                    alert("Form submitted successfully!");
                        return true;
                  } 
	              </script>




            <!-- /.card -->

            <!-- general form elements -->
           
            <!-- /.card -->

            
            <!-- /.card -->
            
            <!-- /.card -->

          </div>
          <!--/.col (left) -->
          <!-- right column -->
          
          <!--/.col (right) -->
        </div>
        <!-- /.row -->
      </div><!-- /.container-fluid -->
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
  {% include 'hall/footer.html' %}
