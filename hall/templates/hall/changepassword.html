{% include 'hall/header.html' %}
  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>Change Password</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Change Password</a></li>
              <li class="breadcrumb-item active">Add</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <!-- left column -->
          <div class="col-md-6">
            <!-- general form elements -->
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Change Password</h3>
              </div>
              <!-- /.card-header -->
              <!-- form start -->
              <form method="post" action="{% url 'changepassword' %}" onsubmit="return validate()">
                {% csrf_token %}
                <div class="card-body">
                    <div class="form-group">
                        <label for="exampleInputPassword1">Current Password</label>
                        <input type="password" class="form-control" id="currentPassword" name="currentPassword" placeholder="Current Password">
                    </div>
                     <div class="form-group">
                        <label for="exampleInputPassword1">New Password</label>
                        <input type="password" class="form-control" id="newpassword" name="newPassword" placeholder="New Password">
                    </div>

                    <div class="form-group">
                      <label for="exampleInputtext1">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmpassword" name="confirmPassword" placeholder="Confirm Password">
                    </div>
                </div>
                <!-- /.card-body -->

                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            </div>


          <!-- Java  Script Add Function Call -->
              
          <script>
            function validate()
            {
                var currentPassword = document.getElementById('currentPassword').value;
                if(currentPassword == '')
                {
                    alert("Please Enter Current Password");
                    return false;
                }

                // var newpassword = document.getElementById('newpassword').value;
                // if(newpassword == '')
                // {
                //     alert("Please Enter New Password");
                //     return false;
                // }

                var newpassword = document.getElementById('newpassword').value;
                        if(newpassword == '')
                      {
                        alert("Please Enter New Password");
                        return false;
                      }
                      if(newpassword != '')
                      {
                        if(newpassword.length < 6)
                        {
                          alert("Please Enter 6 Digit Password");
                          return false;
                        }
                      }



                var confirmpassword = document.getElementById('confirmpassword').value;
                if(confirmpassword == '')
                {
                    alert("Please Enter Confirm Password");
                    return false;
                }
                if(newpassword != confirmpassword)
                {
                    alert("New Password and Confirm Password must be same");
                    return false;
                }

                alert("Form submitted successfully!");
                return true;
            }
          </script>


            <!-- /.card -->

            <!-- general form elements -->
           
            <!-- /.card -->

            
            <!-- /.card -->
            
            <!-- /.card -->

          </div>
          <!--/.col (left) -->
          <!-- right column -->
          
          <!--/.col (right) -->
        </div>
        <!-- /.row -->
      </div><!-- /.container-fluid -->
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
  {% include 'hall/footer.html' %}
