{% include 'hall/header.html' %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6 d-flex justify-content-between align-items-center">
              <h1 class="m-0">Counter Section </h1>
              <a href="{% url 'staticlist' %}">
                <button class="btn btn-primary">List</button>
              </a>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="{% url 'dashbord' %}">Counter Section </a></li>
              <li class="breadcrumb-item active">Home</li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <!-- left column -->
          <div class="col-md-6">
            <!-- general form elements -->
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Static Add Info</h3>
              </div>
              <!-- /.card-header -->
              <!-- form start -->
              <form method="post" enctype="multipart/form-data" onsubmit="return validate()">
                {% csrf_token %}
                <div class="card-body">
                      
                    <div class="form-group">
                      <label for="evt">Number of Wedding</label>
                        <input type="number" min="0" class="form-control" id="now" name="now" placeholder="Enter Number of Wedding" required>
                    </div>

                     <div class="form-group">
                      <label for="">Number of Birthday Party</label>
                        <input type="number" min="0" class="form-control" id="bp" name="nobp" placeholder="Enter Number Birthday Party" required>
                    </div>

                    <div class="form-group">
                      <label for="evt">Number of Farewell</label>
                        <input type="number" min="0" class="form-control" id="nof" name="nof" placeholder="Enter Number Farewell" required>
                    </div>

                    <div class="form-group">
                      <label for="evt">Number of Seminar</label>
                        <input type="number" min="0" class="form-control" id="nos" name="nos" placeholder="Enter Number Seminar" required>
                    </div>
                </div>
                <!-- /.card-body -->

                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            </div>


            <!-- Java  Script Add Function Call -->
              <script>
                  function validate()
                  {
                    var now = document.getElementById('now').value;
                      if(now == '')
                      {
                        alert("Plase Enter Number Of Wedding")
                        return false
                      }

                    var bp = document.getElementById('bp').value;
                      if(bp == '')
                      {
                        alert("Plase Enter Number Of Birthday Party")
                        return false
                      }

                    var nof = document.getElementById('nof').value;
                      if(nof == '')
                      {
                        alert("Plase Enter Number Of Farewell")
                        return false
                      }

                     var nos = document.getElementById('nos').value;
                      if(nos == '')
                      {
                        alert("Plase Enter Number Of Seminar")
                        return false
                      }
                    return true;
                  }
                   
                  // function onlyNumberKey(evt)
                  // {
                  //   return /^\d*?\d*$/.test(evt.target.value+evt.key);
                  // }
	              </script>




            <!-- /.card -->

            <!-- general form elements -->
           
            <!-- /.card -->

            
            <!-- /.card -->
            
            <!-- /.card -->

          </div>
          <!--/.col (left) -->
          <!-- right column -->
          
          <!--/.col (right) -->
        </div>
        <!-- /.row -->
      </div><!-- /.container-fluid -->
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
  {% include 'hall/footer.html' %}
