<script>
    // SweetAlert Toast configuration
    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000
    });   

    // Read flash messages from hidden div and show as SweetAlert toasts
    document.addEventListener('DOMContentLoaded', function() {
        const flashContainer = document.getElementById('flash-messages');
        if (flashContainer) {
            const messages = flashContainer.querySelectorAll('span');
            messages.forEach(function(span) {
                const category = span.getAttribute('data-category');
                const message = span.textContent;
                
                if (category === 'success') {
                    Toast.fire({
                        icon: 'success',
                        title: message
                    });
                } else if (category === 'error' || category === 'danger') {
                    Toast.fire({
                        icon: 'error',
                        title: message
                    });
                }
            });
        }
    });
</script>
