{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding Hall | Log in</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'hall/plugins/fontawesome-free/css/all.min.css' %}">
  <!-- icheck bootstrap -->
  <link rel="stylesheet" href="{% static 'hall/plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'hall/dist/css/adminlte.min.css' %}">
  <link rel="stylesheet" href="{% static 'hall/plugins/sweetalert2-theme-bootstrap-4/bootstrap-4.min.css' %}">

</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo">
      <h3>Wedding Hall System</h3>
      <a href="{% url 'login' %}"><b>Wedding Hall</b></a>
  </div>
  <div id="flash-messages" style="display: none;">
    {% if messages %}
        {% for message in messages %}
            <span data-category="{{ message.tags }}">{{ message }}</span>
        {% endfor %}
    {% endif %}
</div>

  <!-- /.login-logo -->
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Sign in to start your session</p>

      
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="input-group mb-3">
          <input type="email" class="form-control" placeholder="Email Address" name="emailAddress" required>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-envelope"></span>
            </div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Password" name="password" required>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-8">
          </div>
          <!-- /.col -->
          <div class="col-4">
            <button type="submit" name="submit" class="btn btn-primary btn-block">Sign In</button>
          </div>
          <!-- /.col -->
        </div>
      </form>
      <!-- /.social-auth-links -->
    </div>
    <!-- /.login-card-body -->
  </div>
</div>
<!-- /.login-box -->

<!-- jQuery -->
<script src="{% static 'hall/plugins/jquery/jquery.min.js' %}"></script>
<!-- Bootstrap 4 -->
<script src="{% static 'hall/plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<!-- AdminLTE App -->
<script src="{% static 'hall/dist/js/adminlte.min.js' %}"></script>
<script src="{% static 'department/plugins/sweetalert2/sweetalert2.min.js' %}"></script>

<script>
    // SweetAlert Toast configuration
    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000
    });   

    // Read flash messages from hidden div and show as SweetAlert toasts
    document.addEventListener('DOMContentLoaded', function() {
        const flashContainer = document.getElementById('flash-messages');
        if (flashContainer) {
            const messages = flashContainer.querySelectorAll('span');
            messages.forEach(function(span) {
                const category = span.getAttribute('data-category');
                const message = span.textContent;
                
                if (category === 'success') {
                    Toast.fire({
                        icon: 'success',
                        title: message
                    });
                } else if (category === 'error' || category === 'danger') {
                    Toast.fire({
                        icon: 'error',
                        title: message
                    });
                }
            });
        }
    });
</script>
</body>
</html>
